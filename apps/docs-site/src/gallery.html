<!DOCTYPE html>
<html lang="en" data-theme="wa2-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Agent — Demo Gallery</title>
  <base href="/public/web-agent-docs/" />

  <!-- Beer CSS (needed for FAB circle button + Material Symbols icon font) -->
  <link rel="stylesheet" href="vendor/beercss/beer.min.css" />
  <script type="module" src="vendor/beercss/beer.min.js"></script>

  <!-- Public Sans base font -->
  <link rel="stylesheet" href="vendor/public-sans/public-sans.css" />

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: var(--wa-font-family, system-ui, -apple-system, sans-serif);
      background: var(--wa-background-color, #fafafa);
      color: var(--wa-text-color, #333);
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p.lead { margin: 0 0 24px; color: var(--wa-label-color, #555); font-size: 0.95rem; }

    #gallery .strip {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    }

    #gallery figure {
      margin: 0;
      background: var(--wa-smart-list-background-color, #fff);
      border: 1px solid var(--wa-border-color, #e0e0e0);
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
      overflow: hidden;
    }

    #gallery figcaption {
      padding: 8px 0 4px;
      font-size: 0.85rem;
      color: var(--wa-label-color, #555);
    }

    /* 003: the bubble is a shadow element and paints its own launcher from
       --wa-* tokens. Beer CSS cannot cross that boundary, so the tile pins
       the launcher back inside itself through the exposed part. Scoped to
       #gallery so the ?frame= renderer and the live docs launcher are
       untouched. */
    #gallery web-agent-bubble::part(launcher) {
      position: static;
      inset: auto;
      margin: 0;
    }
    /* The tiles leave launcherIcon unset, so the launcher renders the default
       <i>chat</i> Material Symbols ligature. Beer CSS applies that font with a
       global `i` rule, which is tree-scoped and cannot reach inside the
       bubble's shadow root — without this the tile would read the word "chat".
       font-family set on the part inherits into the <i> inside the root. */
    #gallery web-agent-bubble::part(launcher-icon) {
      font-family: "Material Symbols Outlined";
      font-size: 24px;
    }

    .responsive-section {
      margin-top: 40px;
    }
    .responsive-section h2 {
      font-size: 1.1rem;
      margin: 0 0 8px;
    }
    .responsive-section p {
      margin: 0 0 16px;
      color: var(--wa-label-color, #555);
      font-size: 0.9rem;
    }
    .responsive-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    iframe.vp-desktop {
      width: 900px;
      height: 680px;
      border: 1px solid var(--wa-border-color, #e0e0e0);
      border-radius: 8px;
    }
    iframe.vp-mobile {
      width: 375px;
      height: 680px;
      border: 1px solid var(--wa-border-color, #e0e0e0);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Web Agent — Demo Gallery</h1>
  <div id="theme-switcher"></div>
  <p class="lead">
    All 10 UI states rendered deterministically from canned data — no live LLM, no network.
  </p>

  <div id="gallery">
    <div class="strip"></div>

    <div class="responsive-section">
      <h2>Responsive</h2>
      <p>Desktop floating (wide iframe) vs mobile full-width (375 px iframe).</p>
      <div class="responsive-row"></div>
    </div>
  </div>

</body>
</html>
