# The model list for this brand. The build compiles it into dist/brand.json and
# the options page offers exactly these entries, in this order. The FIRST entry
# is what a fresh profile uses before anything is saved.
#
# Every entry needs id, label, endpoint, wireFormat and model. `streaming` is
# optional and defaults to false. `wireFormat` is anthropic, openai or gemini.
#
# The path each wire format needs is fixed by the core providers:
#   - openai:    ".../api/openai/v1"  -> provider appends "/chat/completions"
#   - anthropic: ".../api/anthropic"  -> provider appends "/v1/messages"
#   - gemini:    ".../api/gemini"     -> provider appends
#     "/v1beta/models/{model}:generateContent", so NO "/v1" suffix.
models:
  - id: anthropic-sonnet-nonstream
    label: "Sonnet (non-stream)"
    endpoint: "http://localhost:28780/api/anthropic"
    wireFormat: anthropic
    model: sonnet
    streaming: false
  - id: anthropic-sonnet-stream
    label: "Sonnet (stream)"
    endpoint: "http://localhost:28780/api/anthropic"
    wireFormat: anthropic
    model: sonnet
    streaming: true
  - id: openai-sonnet-stream
    label: "Sonnet OpenAI (stream)"
    endpoint: "http://localhost:28780/api/openai/v1"
    wireFormat: openai
    model: sonnet
    streaming: true
  - id: openai-sonnet-nonstream
    label: "Sonnet OpenAI (non-stream)"
    endpoint: "http://localhost:28780/api/openai/v1"
    wireFormat: openai
    model: sonnet
    streaming: false
  - id: gemini-flash-stream
    label: "Gemini Flash (stream)"
    endpoint: "http://localhost:28780/api/gemini"
    wireFormat: gemini
    model: gemini-flash-lite-latest
    streaming: true
  - id: gemini-flash-nonstream
    label: "Gemini Flash (non-stream)"
    endpoint: "http://localhost:28780/api/gemini"
    wireFormat: gemini
    model: gemini-flash-lite-latest
    streaming: false
