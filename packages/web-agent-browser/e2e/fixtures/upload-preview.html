<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Preview</title>
  <style>
    body {
      margin: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #111827;
      background: #ffffff;
      line-height: 1.5;
    }
    main { max-width: 760px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    h2 { font-size: 16px; margin: 20px 0 8px; }
    .field {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
    }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
    }
    .meta { font-size: 14px; font-weight: 500; }
    .text-preview {
      margin: 6px 0 0;
      padding: 6px 8px;
      background: #f3f4f6;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    img.preview {
      display: block;
      margin-top: 8px;
      max-width: 320px;
      max-height: 200px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>File Upload Bench</h1>
    <div class="field">
      <label for="upload">Upload files</label>
      <input id="upload" type="file" multiple />
    </div>

    <p id="change-summary" data-change-count="0">No files chosen yet.</p>

    <h2>Uploaded files</h2>
    <ul id="uploaded-list"></ul>
  </main>

  <script>
    const input = document.getElementById("upload");
    const summary = document.getElementById("change-summary");
    const list = document.getElementById("uploaded-list");
    const seenByName = new Map();
    let changeCount = 0;

    function isTextMime(type, name) {
      if (type.startsWith("text/")) return true;
      return /\.(md|txt|csv|json|xml|html|css|js|ts|yml|yaml)$/i.test(name);
    }

    input.addEventListener("change", async () => {
      changeCount += 1;
      const current = Array.from(input.files || []);
      summary.dataset.changeCount = String(changeCount);
      summary.textContent = current
        .map((f) => `${f.name}|${f.type}|${f.size}`)
        .join("\n");

      for (const file of current) {
        const prev = seenByName.get(file.name);
        if (prev && prev.blobUrl) URL.revokeObjectURL(prev.blobUrl);
        const entry = {
          name: file.name,
          type: file.type || "(empty)",
          size: file.size,
          blobUrl: file.type.startsWith("image/") ? URL.createObjectURL(file) : null,
          text: !file.type.startsWith("image/") && isTextMime(file.type, file.name) && file.size <= 4096
            ? await file.text()
            : null,
        };
        seenByName.set(file.name, entry);
      }

      list.replaceChildren();
      for (const entry of seenByName.values()) {
        const li = document.createElement("li");
        li.dataset.name = entry.name;
        li.dataset.type = entry.type;
        li.dataset.size = String(entry.size);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${entry.name} — ${entry.type} — ${entry.size} bytes`;
        li.appendChild(meta);

        if (entry.blobUrl) {
          const img = document.createElement("img");
          img.className = "preview";
          img.alt = `Preview of ${entry.name}`;
          img.src = entry.blobUrl;
          li.appendChild(img);
        } else if (entry.text !== null) {
          const pre = document.createElement("pre");
          pre.className = "text-preview";
          pre.textContent = entry.text;
          li.appendChild(pre);
        }
        list.appendChild(li);
      }
    });
  </script>
</body>
</html>
